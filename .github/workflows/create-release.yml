name: CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    if: github.repository_owner == 'Lichens-Innovation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Install Yarn
        uses: mskelton/setup-yarn@v2.0.0

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test

  prepare:
    if: github.repository_owner == 'Lichens-Innovation'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Check if version changed
        id: check
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          echo "Current version: $CURRENT_VERSION"

          # Fetch all tags to ensure we have them
          git fetch --tags

          # Get the latest tag, sorted by version
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n1)

          # If no tags found, use default
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          echo "Latest tag: $LATEST_TAG"

          LATEST_VERSION=${LATEST_TAG#v}

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ];
          then
            echo "Version changed"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Version not changed"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Yarn
        if: steps.check.outputs.version_changed == 'true'
        uses: mskelton/setup-yarn@v2.0.0

      - name: Install dependencies
        if: steps.check.outputs.version_changed == 'true'
        run: yarn install --frozen-lockfile

      - name: Build the project
        if: steps.check.outputs.version_changed == 'true'
        run: yarn build

      - name: Pack package
        if: steps.check.outputs.version_changed == 'true'
        run: npm pack

      - name: Upload package tarball
        if: steps.check.outputs.version_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    if: needs.prepare.outputs.version_changed == 'true' && github.repository_owner == 'Lichens-Innovation'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          registry-url: 'https://registry.npmjs.org/'
          always-auth: true

      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: .

      - name: Publish to npm
        run: npm publish *.tgz --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_LICHENS_TOKEN }}

  publish-github:
    if: needs.prepare.outputs.version_changed == 'true' && github.repository_owner == 'Lichens-Innovation'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          registry-url: 'https://npm.pkg.github.com'
          always-auth: true
          scope: '@lichens-innovation'

      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: .

      - name: Publish to GitHub Packages
        run: npm publish *.tgz --registry=https://npm.pkg.github.com --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: needs.prepare.outputs.version_changed == 'true' && github.repository_owner == 'Lichens-Innovation'
    needs: [prepare, publish-npm, publish-github]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Tag release
        run: |
          git tag -a "v${{ needs.prepare.outputs.new_version }}" -m "v${{ needs.prepare.outputs.new_version }}"
          git push origin "v${{ needs.prepare.outputs.new_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: v${{ needs.prepare.outputs.new_version }}
          name: Release v${{ needs.prepare.outputs.new_version }}
          generate_release_notes: true
